if ($umeko_tools_request_ok = 0) { return 403; }

auth_request /_umeko_tools_auth;
error_page 401 = @umeko_tools_login;

proxy_http_version 1.1;
proxy_set_header Connection close;
proxy_set_header Host "127.0.0.1:$umeko_tools_local_port";
proxy_set_header Origin "http://127.0.0.1:$umeko_tools_local_port";
proxy_set_header Cookie "";
proxy_set_header Authorization "";
proxy_read_timeout 450s;
proxy_hide_header Cache-Control;
add_header Cache-Control no-store always;
