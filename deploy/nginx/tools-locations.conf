location = /_umeko_tools_auth {
    internal;
    client_max_body_size 14m;
    proxy_pass http://127.0.0.1:3100/api/api/admin/tools-session;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location @umeko_tools_login {
    if ($umeko_tools_login_target = "") { return 401; }
    return 302 /manage_login/?next=$umeko_tools_login_target;
}

location = /uresource { return 308 /uresource/; }
location = /utoken { return 308 /utoken/; }
location = /utoken/qwen-q8 { return 308 /utoken/qwen-q8/; }
location = /utoken/qwen-w8a8-fp8 { return 308 /utoken/qwen-w8a8-fp8/; }
location = /utoken/h3 { return 308 /utoken/h3/; }

location ^~ /uresource/ {
    client_max_body_size 14m;
    set $umeko_tools_local_port 8786;
    include /etc/nginx/snippets/umeko-tools-proxy.conf;
    proxy_pass http://127.0.0.1:18786/;
}

location ^~ /utoken/ {
    set $umeko_tools_local_port 8787;
    include /etc/nginx/snippets/umeko-tools-proxy.conf;
    proxy_pass http://127.0.0.1:18787/;
}

location ^~ /utoken/qwen-q8/ {
    set $umeko_tools_local_port 8788;
    include /etc/nginx/snippets/umeko-tools-proxy.conf;
    proxy_pass http://127.0.0.1:18788/;
}

location ^~ /utoken/qwen-w8a8-fp8/ {
    set $umeko_tools_local_port 8789;
    include /etc/nginx/snippets/umeko-tools-proxy.conf;
    proxy_pass http://127.0.0.1:18789/;
}

location ^~ /utoken/h3/ {
    set $umeko_tools_local_port 8793;
    include /etc/nginx/snippets/umeko-tools-proxy.conf;
    proxy_pass http://127.0.0.1:18793/;
}
