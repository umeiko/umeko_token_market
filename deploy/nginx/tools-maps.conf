map "$request_method:$host:$http_origin" $umeko_tools_request_ok {
    default 0;
    ~^(GET|HEAD): 1;
    "POST:umekolab.cn:https://umekolab.cn" 1;
    "POST:www.umekolab.cn:https://www.umekolab.cn" 1;
}

map $uri $umeko_tools_login_target {
    default "";
    /uresource/ /uresource/;
    /utoken/ /utoken/;
    /utoken/qwen-q8/ /utoken/qwen-q8/;
    /utoken/qwen-w8a8-fp8/ /utoken/qwen-w8a8-fp8/;
    /utoken/h3/ /utoken/h3/;
}
