<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#141f31">
<title>模型转发 · utoken</title>
<style>
:root {
  color-scheme: light;
  font: 14px/1.5 "Noto Sans SC", system-ui, sans-serif;
  --ink: #1b2537; --muted: #56647a; --line: #dce3ee; --paper: #fff;
  --blue: #274db6; --wash: #f1f4f9; --nav: #141f31;
  color: var(--ink); background: var(--wash);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; }
h1, h2, p { margin: 0; }
button, input, select { font: inherit; }
button, summary { cursor: pointer; }
button:disabled { opacity: .54; cursor: default; }
:focus-visible { outline: 2px solid #567bd5; outline-offset: 3px; }
a { color: var(--blue); }
.top { background: var(--nav); color: #edf2ff; }
.top div { max-width: 1160px; min-height: 58px; margin: auto; display: flex; align-items: center; gap: 11px; padding-inline: clamp(16px, 4vw, 38px); }
.logo { display: grid; place-items: center; width: 31px; height: 31px; border-radius: 9px; color: #14203a; background: #bdd0ff; font-weight: 800; }
.top b { font-size: 16px; }
.top small { margin-left: auto; color: #b9c6df; }
main { max-width: 1160px; margin: auto; padding: 30px clamp(16px, 4vw, 38px) 48px; }
.workspace { display: grid; grid-template-columns: minmax(210px, 255px) minmax(0, 1fr); gap: 20px; align-items: start; }
.sidebar, .editor, .status-panel { background: var(--paper); border: 1px solid var(--line); border-radius: 13px; min-width: 0; }
.sidebar { position: sticky; top: 16px; }
.side-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 13px 14px; border-bottom: 1px solid var(--line); }
.side-head h2, h2 { font-size: 15px; }
.model-list { margin: 0; padding: 6px; display: grid; gap: 3px; list-style: none; max-height: min(70vh, 600px); overflow-y: auto; }
.model { display: grid; gap: 4px; padding: 10px; border: 1px solid transparent; border-radius: 8px; text-align: left; color: var(--ink); background: transparent; width: 100%; }
.model:hover { background: #f2f5fa; }
.model[aria-current] { border-color: #ccdafd; background: #edf2fe; }
.model strong, .mapping strong { overflow-wrap: anywhere; }
.model span { font-size: 12px; color: var(--muted); }
.light { display: inline-block; margin-right: 6px; width: 6px; height: 6px; border-radius: 50%; background: #8090ab; vertical-align: 2px; }
.light.ready { background: #287a5e; }
.section-head { display: flex; align-items: start; justify-content: space-between; gap: 12px; padding: 18px 20px; border-bottom: 1px solid var(--line); }
.section-head h1 { font-size: clamp(20px, 3vw, 28px); letter-spacing: -.025em; overflow-wrap: anywhere; }
.section-head small, .muted, .empty { color: var(--muted); }
.section-head small { display: block; margin-top: 3px; }
form { display: grid; gap: 18px; padding: 18px 20px; }
.group { display: grid; gap: 11px; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px 13px; }
.field { display: grid; gap: 4px; min-width: 0; font-weight: 570; font-size: 13px; }
.field input, .field select {
  min-width: 0; width: 100%; min-height: 37px; padding: 7px 9px; color: var(--ink);
  background: var(--paper); border: 1px solid #c4cfdf; border-radius: 7px;
}
.field small { color: var(--muted); font-weight: normal; }
.check { font-size: 13px; display: flex; align-items: center; gap: 6px; }
input[type=checkbox] { accent-color: var(--blue); }
details summary { font-weight: 590; color: var(--muted); font-size: 13px; }
details .fields { padding-top: 9px; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; padding-top: 13px; border-top: 1px solid var(--line); }
.btn { min-height: 35px; padding: 6px 10px; background: var(--paper); color: var(--ink); border: 1px solid #ccd6e5; border-radius: 7px; font-weight: 610; font-size: 13px; white-space: nowrap; text-decoration: none; }
.btn:hover { background: #edf2fa; }
.btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
.btn.primary:hover { background: #1a3c9d; }
.btn.danger { color: #a13939; }
.feedback { background: #eef3ff; color: #234486; margin: 0 20px 16px; padding: 8px 10px; border-radius: 7px; font-size: 13px; overflow-wrap: anywhere; }
.feedback.error { background: #fff0ed; color: #8f302c; }
.status-panel { margin-top: 14px; padding: 12px 17px; }
.status-panel summary { color: var(--ink); }
.status-panel p { font-size: 13px; margin-top: 8px; }
.status-panel pre { max-height: 210px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; background: #f2f5fa; padding: 10px; margin: 10px 0 0; border-radius: 7px; font-size: 12px; }
.mapping { padding-left: 20px; overflow-wrap: anywhere; margin: 6px 0; font-size: 13px; }
.empty { padding: 14px; font-size: 13px; }
@media (max-width: 700px) {
  main { padding-top: 16px; }
  .workspace { grid-template-columns: 1fr; gap: 12px; }
  .sidebar { position: static; }
  .model-list { max-height: 178px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 145px), 1fr)); }
}
@media (max-width: 430px) {
  .fields { grid-template-columns: 1fr; }
  form, .section-head { padding: 13px; }
}
</style>
</head>
<body>
<header class="top"><div><span class="logo" aria-hidden="true">U</span><b>utoken</b><small>本地连接器</small></div></header>
<main>
  <div class="workspace">
    <aside class="sidebar" aria-labelledby="models-heading">
      <div class="side-head"><h2 id="models-heading">模型</h2><button id="new-model" class="btn" type="button">＋ 新建</button></div>
      <ul id="model-list" class="model-list"></ul>
      <p id="empty-list" class="empty" hidden>暂无模型</p>
    </aside>
    <div>
      <p id="loading" class="editor empty" role="status">正在读取模型配置…</p>
      <section id="editor" class="editor" hidden aria-labelledby="model-heading">
        <div class="section-head">
          <div><h1 id="model-heading">新建模型</h1><small id="selected-status" hidden></small></div>
          <button id="delete-model" class="btn danger" type="button" hidden>删除</button>
        </div>
        <form id="configuration">
          <section class="group" aria-labelledby="local-heading">
            <h2 id="local-heading">本地服务</h2>
            <div class="fields">
              <label class="field">显示名称<input name="name" required maxlength="100"></label>
              <label class="field">模型类别<select name="serviceType"><option value="api">文本生成</option><option value="video">视频生成</option></select></label>
              <label class="field">模型 ID<input name="modelId" maxlength="256" placeholder="可从服务自动发现" spellcheck="false"></label>
              <label class="field">本地服务地址<input name="localBaseUrl" type="url" required placeholder="http://127.0.0.1:8080" spellcheck="false"></label>
              <label class="field">健康检查路径<input name="healthPath" required maxlength="201" spellcheck="false" value="/v1/models"></label>
              <label class="field">本地 API Key<input name="localApiKey" type="password" autocomplete="off" placeholder="仅在服务需要鉴权时填写"></label>
            </div>
            <label class="check" id="clear-local-row" hidden><input name="clearLocalKey" type="checkbox">清除已保存的本地 API Key</label>
          </section>
          <section class="group" aria-labelledby="connection-heading">
            <h2 id="connection-heading">云端连接</h2>
            <label class="field">配对链接<input name="pairingLink" type="password" autocomplete="off" maxlength="2048" placeholder="粘贴 Relay 生成的配对链接"></label>
            <p class="muted" id="pairing-state"></p>
            <details id="advanced">
              <summary>手动配置云端</summary>
              <div class="fields">
                <label class="field">云端 API 地址<input name="cloudUrl" spellcheck="false" placeholder="https://example.com/api"></label>
                <label class="field">供应商 ID<input name="providerId" type="number" min="1" step="1" placeholder="云端供应商编号"></label>
                <label class="field">连接凭据<input name="providerToken" type="password" autocomplete="off" placeholder="umo-agent-…"></label>
              </div>
            </details>
            <label class="check"><input name="autoConnect" type="checkbox" checked>启动 utoken 时自动连接</label>
            <label class="check" id="clear-pairing-row" hidden><input name="clearPairing" type="checkbox">解除当前配对</label>
          </section>
          <div class="actions">
            <button class="btn primary" type="submit" id="save-model">保存模型</button>
            <button class="btn" type="submit" id="connect">保存并连接</button>
            <button class="btn" type="button" id="probe">探测本地服务</button>
            <button class="btn" type="button" id="stop" hidden>断开转发</button>
          </div>
        </form>
        <p id="feedback" class="feedback" role="status" hidden></p>
      </section>
      <details id="details" class="status-panel" hidden>
        <summary>模型发现和连接日志</summary>
        <p id="connection-details"></p>
        <p id="local-models"></p>
        <ul id="cloud-models" class="mapping"></ul>
        <pre id="logs"></pre>
      </details>
    </div>
  </div>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const form = $('configuration');
const fields = form.elements;
const types = {api: '文本生成', video: '视频生成'};
const states = {offline: '未连接', online: '云端在线', connecting: '连接中', authenticating: '验证中', reconnecting: '重连中'};
let selected;
let saved = {};
let current;
let listSnapshot = '';
let pending = false;
let refreshPending = false;

async function api(route, data, id = null) {
  const url = new URL('api/' + route, location.href);
  if (id) url.searchParams.set('model', id);
  const response = await fetch(url, data === undefined ? {} : {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data),
  });
  if (response.status === 401 && location.pathname.startsWith('/utoken/')) {
    location.assign('/manage_login/?next=' + encodeURIComponent(location.pathname));
    throw new Error('请重新使用管理员密钥登录');
  }
  const result = await response.json();
  if (!response.ok) throw new Error(result.error || '操作失败');
  return result;
}

function feedback(text = '', error = false) {
  const area = $('feedback');
  area.textContent = text;
  area.hidden = !text;
  area.classList.toggle('error', error);
}

function node(tag, text, className) {
  const item = document.createElement(tag);
  if (text !== undefined) item.textContent = text;
  if (className) item.className = className;
  return item;
}

function renderList(rows) {
  const fingerprint = JSON.stringify([selected, rows]);
  if (fingerprint === listSnapshot) return;
  listSnapshot = fingerprint;
  const focused = document.activeElement?.dataset.model;
  $('model-list').replaceChildren(...rows.map(model => {
    const item = node('li');
    const button = node('button', undefined, 'model');
    button.type = 'button';
    button.dataset.model = model.id;
    if (selected === model.id) button.setAttribute('aria-current', 'true');
    const info = node('span');
    info.append(node('i', '', 'light' + (model.localOnline ? ' ready' : '')),
      document.createTextNode(types[model.serviceType] + ' · ' + (model.localOnline ? '本机可用' : states[model.connectionState])));
    button.append(node('strong', model.name), info);
    button.addEventListener('click', () => {
      if (model.id !== selected) select(model.id, true);
    });
    item.append(button);
    return item;
  }));
  if (focused) [...$('model-list').querySelectorAll('button')].find(button => button.dataset.model === focused)?.focus({preventScroll: true});
  $('empty-list').hidden = rows.length > 0;
}

function pairingType() {
  try {
    const data = new URLSearchParams(new URL(fields.pairingLink.value.trim()).hash.slice(1));
    if (data.get('utoken') === '1' && data.get('service') in types) return data.get('service');
  } catch {}
  return '';
}

function updateControls() {
  const link = fields.pairingLink.value.trim();
  const detected = pairingType();
  fields.serviceType.disabled = pending || Boolean(detected);
  $('pairing-state').textContent = detected ? '配对链接类别 · ' + types[detected]
    : saved.hasProviderToken ? '已保存云端配对' : '未配对';
  $('connect').textContent = link ? '配对并连接' : '保存并连接';
  $('save-model').textContent = selected ? '保存修改' : '保存模型';
  $('connect').disabled = pending || fields.clearPairing.checked
    || !(link || fields.providerToken.value.trim() || saved.hasProviderToken);
  for (const id of ['save-model', 'probe', 'new-model', 'delete-model']) $(id).disabled = pending;
  $('stop').hidden = !selected || !current || current.connectionState === 'offline';
  $('stop').disabled = pending;
  $('delete-model').hidden = !selected;
}

function formData() {
  const data = {name: fields.name.value.trim(), modelId: fields.modelId.value.trim(),
    serviceType: fields.serviceType.value, localBaseUrl: fields.localBaseUrl.value.trim(),
    healthPath: fields.healthPath.value.trim(), autoConnect: fields.autoConnect.checked};
  if (fields.cloudUrl.value.trim()) data.cloudUrl = fields.cloudUrl.value.trim();
  if (fields.providerId.value) data.providerId = Number(fields.providerId.value);
  if (fields.providerToken.value.trim()) data.providerToken = fields.providerToken.value.trim();
  if (fields.localApiKey.value.trim() || fields.clearLocalKey.checked) data.localApiKey = fields.localApiKey.value.trim();
  if (fields.clearPairing.checked) data.clearPairing = true;
  return data;
}

function fillForm(config) {
  form.reset();
  saved = config;
  fields.name.value = config.name || '';
  fields.modelId.value = config.modelId || '';
  fields.serviceType.value = config.serviceType || 'api';
  fields.healthPath.value = config.healthPath || '/v1/models';
  fields.localBaseUrl.value = config.localBaseUrl || '';
  fields.cloudUrl.value = config.hasProviderToken ? config.cloudUrl : '';
  fields.providerId.value = config.hasProviderToken ? config.providerId : '';
  fields.autoConnect.checked = config.autoConnect ?? true;
  fields.localApiKey.placeholder = config.hasLocalApiKey ? '已保存，留空保留' : '仅在服务需要鉴权时填写';
  fields.providerToken.placeholder = config.hasProviderToken ? '已保存，留空保留' : 'umo-agent-…';
  $('advanced').open = false;
  $('clear-local-row').hidden = !config.hasLocalApiKey;
  $('clear-pairing-row').hidden = !config.hasProviderToken;
  $('model-heading').textContent = config.name || '新建模型';
  $('selected-status').hidden = !selected;
  $('selected-status').textContent = '正在检查…';
  updateControls();
}

function setSelected(id) {
  selected = id;
  const target = id ? '#model/' + encodeURIComponent(id) : '#new';
  history.replaceState(null, '', target);
}

async function select(id, focus = false) {
  if (pending) return;
  pending = true;
  current = null;
  setSelected(id);
  updateControls();
  try {
    fillForm(id ? await api('config', undefined, id) : {});
    $('editor').hidden = false;
    $('loading').hidden = true;
    $('details').hidden = !id;
    feedback();
    if (focus) fields.name.focus();
  } catch (error) {
    $('loading').hidden = false;
    $('loading').textContent = error.message;
  } finally {
    pending = false;
    updateControls();
    refresh();
  }
}

function showStatus(status) {
  current = status;
  const local = status.localOnline ? '本机可用' : '本机未就绪';
  const cloud = saved.hasProviderToken ? states[status.connectionState] : '未配对';
  $('selected-status').textContent = local + ' · ' + cloud;
  $('connection-details').textContent = [
    status.providerName, status.connectionError || status.healthMessage,
    status.localOnline ? '探测延迟 ' + status.localLatency + ' ms' : '',
    status.activeRequests + ' 个请求处理中',
  ].filter(Boolean).join(' · ');
  $('local-models').textContent = status.localModels.length ? '检测到 ' + status.localModels.join('、') : '暂无发现的模型 ID';
  $('cloud-models').replaceChildren(...status.cloudModels.map(model =>
    node('li', model.name + ' → ' + (model.upstream_name || model.name) + (model.enabled ? '' : '（云端停用）'))));
  $('logs').textContent = status.logs.join('\n') || '还没有连接日志。';
  updateControls();
}

async function refresh() {
  if (pending || refreshPending) return;
  refreshPending = true;
  const id = selected;
  try {
    const {models, preferred} = await api('models');
    if (id !== selected || pending) return;
    if (selected === undefined) {
      const match = location.hash.match(/^#model\/([a-zA-Z0-9_-]+)$/)?.[1];
      const initial = location.hash === '#new' ? null : models.find(model => model.id === (match || preferred))?.id
        || models[0]?.id || null;
      renderList(models);
      await select(initial);
      renderList(models);
      return;
    }
    if (id && !models.some(model => model.id === id)) {
      await select(models[0]?.id || null);
      renderList(models);
      return;
    }
    renderList(models);
    if (id) {
      const status = await api('status', undefined, id);
      if (id === selected && !pending) showStatus(status);
    }
  } catch (error) {
    if ($('editor').hidden) $('loading').textContent = error.message;
    else feedback(error.message, true);
  } finally { refreshPending = false; }
}

async function perform(action) {
  if (pending) return;
  pending = true;
  updateControls();
  try { await action(); }
  catch (error) { feedback(error.message, true); }
  finally {
    pending = false;
    updateControls();
    refresh();
  }
}

function changeType(value) {
  const previous = fields.serviceType.value;
  fields.serviceType.value = value;
  const defaultPaths = {api: '/v1/models', video: '/health'};
  if (!fields.healthPath.value.trim() || fields.healthPath.value === defaultPaths[previous]) {
    fields.healthPath.value = defaultPaths[value];
  }
}

fields.serviceType.addEventListener('change', () => {
  const value = fields.serviceType.value;
  const oppositeDefault = value === 'video' ? '/v1/models' : '/health';
  if (!fields.healthPath.value || fields.healthPath.value === oppositeDefault) {
    fields.healthPath.value = value === 'video' ? '/health' : '/v1/models';
  }
});
fields.pairingLink.addEventListener('input', () => {
  const detected = pairingType();
  if (detected) changeType(detected);
  updateControls();
});
fields.providerToken.addEventListener('input', updateControls);
fields.clearPairing.addEventListener('change', updateControls);

form.addEventListener('submit', event => {
  event.preventDefault();
  const connect = event.submitter?.id === 'connect';
  const data = formData();
  const link = fields.pairingLink.value.trim();
  perform(async () => {
    const newModel = !selected;
    if (newModel) {
      const created = await api('models', data);
      setSelected(created.id);
      saved = await api('config', undefined, selected);
      $('model-heading').textContent = saved.name;
      $('details').hidden = false;
    }
    if (connect) {
      if (link) await api('pair', {...data, link}, selected);
      else await api('start', data, selected);
    } else if (!newModel || data.providerToken) {
      await api('config', data, selected);
    }
    fillForm(await api('config', undefined, selected));
    feedback(connect ? '模型已保存，正在连接云端。' : '模型已保存。');
  });
});
$('new-model').addEventListener('click', () => select(null, true));
$('probe').addEventListener('click', () => {
  if (!fields.localBaseUrl.reportValidity() || !fields.healthPath.reportValidity()) return;
  const {localBaseUrl, healthPath, serviceType, localApiKey} = formData();
  perform(async () => {
    const result = await api('probe', {localBaseUrl, healthPath, serviceType, localApiKey}, selected);
    feedback(result.online ? '本地服务可访问 · ' + result.latency + ' ms'
      + (result.models.length ? ' · ' + result.models.join('、') : '') : result.message, !result.online);
  });
});
$('stop').addEventListener('click', () => perform(async () => {
  await api('stop', {}, selected);
  feedback('已断开转发。');
}));
$('delete-model').addEventListener('click', () => {
  if (!selected || !confirm('删除「' + saved.name + '」的本地配置并断开转发？')) return;
  perform(async () => {
    await api('models/delete', {}, selected);
    const {models} = await api('models');
    const next = models[0]?.id || null;
    setSelected(next);
    current = null;
    fillForm(next ? await api('config', undefined, next) : {});
    $('details').hidden = !next;
    renderList(models);
    feedback('本地模型配置已删除。');
  });
});
refresh();
setInterval(() => { if (!document.hidden) refresh(); }, 2500);
</script>
</body>
</html>
