Match User umeko-tools-tunnel
    AuthenticationMethods publickey
    AllowTcpForwarding remote
    AllowStreamLocalForwarding no
    GatewayPorts no
    PermitListen 127.0.0.1:18786 127.0.0.1:18787 127.0.0.1:18788 127.0.0.1:18789 127.0.0.1:18793
    MaxSessions 0
    PermitTTY no
    PermitTunnel no
    AllowAgentForwarding no
    X11Forwarding no
Match all
